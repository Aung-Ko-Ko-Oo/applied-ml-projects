train-sets:
  - train.my.sp
  - train.hi.sp
valid-sets:
  - valid.my.sp
  - valid.hi.sp
model: model_s2s_my_hi.npz
type: s2s
dim-emb: 256
dim-rnn: 512
enc-depth: 2
dec-depth: 2
learn-rate: 0.0003
lr-warmup: 2000
lr-decay-inv-sqrt: 2000
clip-norm: 5
dropout-rnn: 0.2
dropout-src: 0.1
dropout-trg: 0.1
valid-metrics:
  - cross-entropy
early-stopping: 5
valid-freq: 500
save-freq: 500
optimizer: adam
optimizer-params: [0.9, 0.98, 1e-09]
mini-batch: 32
workspace: 2000
beam-size: 4
